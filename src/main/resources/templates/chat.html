<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="chat-page" class="chat-page">
        <div class="chat-container">
            <div class="chat-header">
                <h2>💬 Chat Room</h2>
                <p>Welcome, <span id="username-display"></span>!</p>
            </div>
            
            <div class="connecting">
                <span class="loader"></span>
                Connecting to chat...
            </div>
            
            <div class="chat-main">
                <ul id="messageArea" class="message-area">
                    <!-- Messages will appear here -->
                </ul>
                
                <div class="users-sidebar">
                    <div class="users-header">
                        <h3>👥 Online Users</h3>
                        <span id="user-count" class="user-count">0</span>
                    </div>
                    <div class="gender-filter">
                        <button class="filter-btn active" id="filterAll" onclick="filterByGender('all')">
                            All
                        </button>
                        <button class="filter-btn" id="filterMale" onclick="filterByGender('Male')">
                            👑 Male
                        </button>
                        <button class="filter-btn" id="filterFemale" onclick="filterByGender('Female')">
                            👸 Female
                        </button>
                    </div>
                    <div class="users-search">
                        <input type="text" id="userSearch" placeholder="🔍 Search users..." class="user-search-input" autocomplete="off" />
                    </div>
                    <ul id="usersList" class="users-list">
                        <!-- Online users will appear here -->
                    </ul>
                    <div id="noUsersFound" class="no-users-found hidden">No users found</div>
                </div>
            </div>
            
            <form id="messageForm" name="messageForm" class="message-form">
                <div class="form-group">
                    <div class="ai-tone-buttons">
                        <button type="button" class="tone-btn" onclick="transformMessage('romantic')" title="Make it romantic">💕 Romantic</button>
                        <button type="button" class="tone-btn" onclick="transformMessage('professional')" title="Make it professional">💼 Professional</button>
                        <button type="button" class="tone-btn" onclick="transformMessage('funny')" title="Make it funny">😄 Funny</button>
                        <button type="button" class="tone-btn" onclick="transformMessage('poetic')" title="Make it poetic">📜 Poetic</button>
                        <button type="button" class="tone-btn" onclick="transformMessage('casual')" title="Make it casual">😎 Casual</button>
                        <button type="button" class="tone-btn" onclick="transformMessage('formal')" title="Make it formal">🎩 Formal</button>
                    </div>
                    <div class="input-group">
                        <button type="button" class="emoji-trigger" id="mainEmojiBtn" title="Add emoji">😊</button>
                        <input type="text" id="message" placeholder="Type a message..." autocomplete="off" spellcheck="true" class="form-control" required />
                        <button type="submit" class="send-button accent">Send</button>
                    </div>
                </div>
            </form>
        </div>
        
        <div id="privateChatModal" class="private-chat-modal hidden">
            <div class="private-chat-container">
                <div class="private-chat-header">
                    <h3>💬 Private Chat with <span id="privateChatUsername"></span></h3>
                    <button class="close-private-chat" onclick="closePrivateChat()">✕</button>
                </div>
                
                <ul id="privateChatArea" class="private-chat-area">
                    <!-- Private messages will appear here -->
                </ul>
                
                <form id="privateMessageForm" class="private-message-form">
                    <div class="form-group">
                        <div class="ai-tone-buttons">
                            <button type="button" class="tone-btn" onclick="transformPrivateMessage('romantic')" title="Make it romantic">💕 Romantic</button>
                            <button type="button" class="tone-btn" onclick="transformPrivateMessage('professional')" title="Make it professional">💼 Professional</button>
                            <button type="button" class="tone-btn" onclick="transformPrivateMessage('funny')" title="Make it funny">😄 Funny</button>
                            <button type="button" class="tone-btn" onclick="transformPrivateMessage('poetic')" title="Make it poetic">📜 Poetic</button>
                            <button type="button" class="tone-btn" onclick="transformPrivateMessage('casual')" title="Make it casual">😎 Casual</button>
                            <button type="button" class="tone-btn" onclick="transformPrivateMessage('formal')" title="Make it formal">🎩 Formal</button>
                        </div>
                        <div class="input-group">
                            <button type="button" class="emoji-trigger" id="privateEmojiBtn" title="Add emoji">😊</button>
                            <input type="text" id="privateMessage" placeholder="Type a private message..." autocomplete="off" spellcheck="true" class="form-control" required />
                            <button type="submit" class="send-button accent">Send</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/image-share.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
